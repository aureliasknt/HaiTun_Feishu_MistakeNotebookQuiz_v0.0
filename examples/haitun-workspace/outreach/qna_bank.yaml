# Scenario 3 answer bank — static, composed once offline from the `agent-basics`
# wiki pages. The deterministic path (0 LLM) answers from here, so revising the
# teaching content means editing this file, not re-generating at runtime.
#
# Each entry: answer (2-3 sentences, sent as the reply), summary (one line, shown
# on the card), then the three follow-ups picked by the card answer —
# next_message (understood) / re_explain (partial) / restart (not_understood) —
# and probe_question, used instead of next_message every Nth card
# (scenario3.card.probe_question_every) to verify a claimed "understood".
#
# `aliases` maps any other keyword in scenario3.keywords to a canonical entry.
# A keyword that resolves to neither is a bank miss → the LLM path (B) answers.
schema_version: 1

qa_bank:
  agent:
    topic: what-is-an-agent
    source_page: wiki/what-is-an-agent.md
    answer: |-
      智能体（agent）是「给定目标后自己决定下一步做什么」的系统，由大模型充当决策者。
      它和聊天机器人的区别在于：智能体有工具、能看到每一步动作的结果，再据此决定下一步；
      和固定工作流的区别在于：分支是运行时由模型选的，不是人事先写死的。
      代价是更灵活但更难预测——所以「限制与风险」是必读项，不是附录。
    summary: 智能体 = 有工具、能看结果、在运行时自己选下一步的系统。
    next_message: |-
      那就继续下一节：**智能体循环（agent loop）**——观察 → 思考 → 行动 → 看结果，
      循环直到目标达成。关键在于「行动的结果会重新进入上下文」，所以智能体能自我纠错。
    re_explain: |-
      换个更简单的说法：判断是不是智能体，只看**谁决定步骤**。
      聊天机器人不决定步骤（只回话）；工作流由写流程的人事先决定；智能体是模型在运行中当场决定。
      拿海豚举个真实例子：你在飞书跟它说「帮我报一下上周的差旅」，
      它自己决定先查报销制度、再找对应的表、发现缺发票就回来问你要——
      这一串步骤没人事先写死，是它当场定的。这个「当场改主意」的能力就是智能体。
    restart: |-
      我们从最简单的地方重新开始，一句话：
      **智能体 = 大模型 + 工具 + 循环。**
      大模型负责想，工具负责做（读文件、发消息…），循环负责「做完看一眼结果，再想下一步」。
      少了工具就只能聊天；少了循环就只能做一次、不会纠错。
    probe_question: |-
      小测一下：一个写死了十几个 if-else 分支的自动化脚本，算智能体吗？为什么？
  agent-loop:
    topic: agent-loop
    source_page: wiki/agent-loop.md
    answer: |-
      智能体循环是重复到目标达成的那个圈：**观察 → 思考 → 行动 → 看结果**。
      一轮里，观察是收集当前状态（用户的话、上一步工具的结果、刚读到的文件），
      思考是模型决定下一步（调哪个工具、传什么参数，或者判断做完了该停），
      行动是执行一次工具调用，结果再作为新的观察回到上下文。
      「结果会回到上下文」是它能自我纠错的原因；也因此有两个现实问题：上下文越跑越长，
      以及循环可能空转——所以总要给步数设上限。
    summary: 观察 → 思考 → 行动 → 看结果，循环往复；结果回到上下文才能自我纠错。
    next_message: |-
      下一节：**工具与工具调用**——智能体究竟怎么碰到外部世界。
      提示：模型自己并不执行任何东西，它只提出「调用 read_file，参数是…」，真正执行的是运行时。
    re_explain: |-
      换个更简单的类比：你修水管时也是这个圈——
      看一眼哪里漏（观察）→ 想该拧哪个（思考）→ 拧一下（行动）→ 再看还漏不漏（结果）。
      海豚也一样：你让它「把这份合同的风险点整理进表格」，
      它先读文档（观察）→ 判断哪几条算风险（思考）→ 写进表（行动）→
      发现表里少一列就回头补上（看结果再调整）。
      关键在**每一轮的「再看一眼」都会写回它的记忆里**，所以上一步做错了，下一步它自己能发现。
      少了这个回看，它就只能盲猜一次然后停下。
    restart: |-
      最简版本，只记四个字：**看、想、做、再看。**
      「再看」是重点——做完一步要把结果收回来，才知道下一步做什么。
      普通的一次模型调用只有「想」，没有后面三步。
    probe_question: |-
      小测一下：怎么判断一个智能体是「做完了」还是「卡住了在空转」？
  tools:
    topic: tools-and-tool-calling
    source_page: wiki/tools-and-tool-calling.md
    answer: |-
      工具就是允许智能体调用、用来碰外部世界的函数：读文件、搜网页、发消息、执行命令。
      工具调用是那套机制——模型输出「工具名 + 结构化参数」，由**运行时**真正去执行。
      关键点：模型自己不执行任何东西，它只提议，控制权在运行时手里。
      安全边界因此是在运行时强制的，而不是指望模型自觉遵守。
      工具描述的质量直接决定智能体的质量：描述含糊，模型就选错工具或传错参数。
    summary: 模型只提议「调用哪个工具、传什么参数」，真正执行的是运行时。
    next_message: |-
      下一节：**智能体记忆**——上下文窗口、短期记忆、长期记忆三层各自会在什么时候丢掉。
    re_explain: |-
      换个更简单的角度：模型像一个只能说话的顾问，工具是它能开口请你做的事。
      它说「请帮我打开这个文件」，动手的是你（运行时）。
      海豚就是这样在飞书里干活的：它想给你发消息，实际调用的是 `feishu_message_send`
      这个工具；想读文档就调 `feishu_doc_read`。它自己碰不到飞书，只能提出请求。
      所以「禁止删库」这条规矩要写在**执行的那一层**，而不是写在顾问的自觉里——
      这也是为什么危险操作要先弹确认，而不是叮嘱模型小心。
    restart: |-
      从最简单说起：**工具 = 智能体能调用的函数。**
      模型只写下「我要调用哪个、参数是什么」，执行的是运行时，结果再交回给模型。
      一句话：**模型出主意，运行时动手。**
    probe_question: |-
      小测一下：如果模型只是「提议」调用工具，那么防止它删掉生产数据的那道闸门应该装在哪一层？
  memory:
    topic: agent-memory
    source_page: wiki/agent-memory.md
    answer: |-
      智能体记忆分三层：上下文窗口（本轮对话 + 工具结果，会话结束就没了）、
      短期记忆（正在跑的会话摘要，同样随会话消失）、
      长期记忆（落在文件或数据库里的事实，只有主动删除才会消失）。
      要点是上下文窗口有限：循环每转一轮都在往里加东西，直到塞满——
      常见解法是把旧的部分摘要掉，或者存到外面、需要时再读回来。
      另外要区分「记住」和「回头再查」：什么都塞进上下文既贵又会淹掉真正重要的信息。
    summary: 三层记忆；上下文窗口有限，值得存的是决定和原因，不是随时能重查的东西。
    next_message: |-
      最后一节：**限制与风险**——幻觉、不可逆操作、空转、成本与注入，这些是基础的一部分。
    re_explain: |-
      换个更简单的类比——用工位来想：上下文窗口是你摊在桌面上的纸，会话一结束就被收走；
      长期记忆是你归档进柜子的那几页。
      海豚就是这么区分的：这次对话说过的话，会话结束就没了；
      但你告诉它「以后报销都走这个流程」，它会写进 memory 存下来，下次还记得。
      桌子大小固定，所以每加一张纸就挤掉一张——真正的技巧是**决定哪几页值得进柜子**：
      决定和它的理由、用户的偏好、项目的约束值得；随时能重新查到的东西不值得。
    restart: |-
      最简版本：**上下文 = 桌面（会话结束就清空），长期记忆 = 档案柜（自己删才会没）。**
      桌面是有限的，塞满了就会挤掉前面的东西——这就是它「忘记」你最初要求的原因。
    probe_question: |-
      小测一下：你怎么判断某一条信息值得写进长期记忆，而不是下次重新查一遍？
  risks:
    topic: agent-limits-and-risks
    source_page: wiki/agent-limits-and-risks.md
    answer: |-
      智能体的失败方式是有规律的：**幻觉**（用同样自信的语气说出不存在的文件或接口，
      解法是先去读、别信回忆，而不是把提示词写得更严厉）、
      **不可逆操作**（删数据、给别人发消息、改生产环境没有撤销键，所以危险动作要先确认）、
      **空转**（同一个思路反复重试；实用规则是失败两次就去找根因、换路子）、
      **成本与延迟**（循环每转一轮就是一次付费调用，真正固定的流程用工作流更便宜）、
      **上下文塞满**（症状很隐蔽：它「忘了」最初的要求，因为那段已被挤出上下文）、
      **数据注入**（文件或网页里可能藏着伪装成指令的文字，外部数据一律当数据、绝不当指令）。
    summary: 幻觉、不可逆操作、空转、成本、上下文塞满、数据注入——六种典型失败。
    next_message: |-
      基础这一轮就走完了：定义 → 循环 → 工具 → 记忆 → 风险。
      接下来可以换个方式：我问、你答，用真实问题检验一下判断力。
    re_explain: |-
      换个更简单的说法，只挑最容易踩的两个：
      **幻觉**——它会一脸确定地报出一个不存在的函数名，所以「先读了再说」比「叮嘱它别瞎说」有用。
      海豚回答制度问题前会先去读那份文档，就是这个道理。
      **不可逆操作**——删掉的数据没有撤销键。所以海豚要替你发消息给别人、提审批之前会先问你一句，
      而改一行本地代码这种随时能还原的，直接做就行。差别只在**能不能撤销**。
    restart: |-
      从最简单说起，只记一句：**智能体会自信地说错话，也会做出撤不回来的事。**
      所以两条规矩：涉及事实的先去查一遍；涉及不可逆的先问一句。
    probe_question: |-
      小测一下：你更愿意要一个「多问几句再动手」的智能体，还是一个「更独立、直接动手」的？为什么？
  haitun:
    topic: haitun
    source_page: wiki/agent-basics.md
    answer: |-
      海豚（HaiTun）是真知的智能体：它接在飞书里，能读写文档表格、发消息、办审批假勤报销，
      也能自己被触发器叫起来干活，而不是只在你问的时候回话。
      按前面那套标准看，它是智能体而不是聊天机器人——有工具、看得到每一步的结果、
      在运行时自己决定下一步。它同样受那些限制约束：不可逆的操作会先问你一句。
    summary: 海豚 = 接在飞书里的智能体，有工具、能被触发器叫起来主动干活。
    next_message: |-
      想更具体的话，下一步可以看**智能体循环**——海豚每次替你办事，
      内部走的就是「观察 → 思考 → 行动 → 看结果」这个圈。
    re_explain: |-
      换个说法：把海豚当成一位在飞书里上班的同事。
      你在群里@它、私聊它，它能去查文档、填表、发通知；
      有些事不用你开口——到点了或者某个状态变了，触发器会把它叫起来。
      它和普通机器人的差别就是：它**自己决定**先查哪份文档、再通知谁。
    restart: |-
      最简单一句：**海豚是真知自己的智能体，长在飞书里。**
      你能让它办事（查文档、填表、发消息），它也会被定时任务和触发器自动叫起来干活。
    probe_question: |-
      小测一下：海豚被触发器自动叫起来干活，和你私聊它让它干活，本质上有什么不同？

