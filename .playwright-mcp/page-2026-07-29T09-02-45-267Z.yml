            - heading "Impactful Campus" [level=3] [ref=e40]
            - paragraph [ref=e43]: Impactful Campus at Universitas Brawijaya represents a tangible effort by higher education to deliver direct contributions to society through the integration of education, research, and community service. Through programs such as community service (KKN), applied research, and technological innovation, UB encourages students and faculty to actively engage in addressing various social, economic, and environmental challenges. This approach not only produces practical and sustainable solutions, but also shapes graduates who are adaptive, socially aware, and ready to become agents of change within society.
            - generic [ref=e44]:
              - link "Berita tentang Kampus Berdampak" [ref=e48] [cursor=pointer]:
