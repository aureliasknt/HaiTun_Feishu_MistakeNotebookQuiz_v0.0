        - generic [ref=e60]:
          - heading "UB GIRAFFE" [level=3] [ref=e63]
          - paragraph [ref=e66]:
            - text: GIRAFFE is a core value framework of Universitas Brawijaya that serves as the foundation for realizing effective, efficient, and sustainable autonomous university governance. This concept integrates seven strategic elements—
            - strong [ref=e67]: Governance, Innovation, Reputation, Alumni, Faculty, Fund, and Efficiency
            - text: —to cultivate an autonomous way of thinking among all stakeholders within UB. As a strategic value pillar, GIRAFFE acts as a reference in translating the university’s vision and mission into strategic objectives, work programs, and various initiatives that support the enhancement of institutional performance and competitiveness.
          - link "Tentang UB GIRAFFE" [ref=e71] [cursor=pointer]:
            - /url: https://www.ub.ac.id/ub-giraffe/
